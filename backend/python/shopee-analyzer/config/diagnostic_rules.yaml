rules:
- id: zero_conversion_waste
  enabled: true
  title: 零转化广告严重浪费预算
  threshold: 0.2
  anchor: baseline
  severity: critical
  description: 零转化广告花费占总花费比例超过{threshold_pct}
- id: cancel_rate_high
  enabled: true
  title: 订单取消率偏高
  threshold: 0.15
  anchor: baseline
  severity: warning
  description: 取消率超过{threshold_pct}
- id: zero_repeat_purchase
  enabled: true
  title: 零复购，完全依赖拉新
  threshold: 0.01
  anchor: baseline
  severity: critical
  description: 复购率低于{threshold_pct}
- id: low_conversion_rate
  enabled: true
  title: 店铺转化率偏低
  threshold: 0.02
  anchor: baseline
  severity: warning
  description: 店铺转化率低于{threshold_pct}
- id: product_over_concentration
  enabled: true
  title: 商品销售过于集中
  threshold: 0.85
  anchor: baseline
  severity: warning
  description: Top5商品销售占比超过{threshold_pct}
- id: high_new_buyer_dependency
  enabled: true
  title: 过度依赖新客拉新
  threshold: 0.8
  anchor: baseline
  severity: warning
  description: 新买家占比超过{threshold_pct}
- id: high_spend_no_conversion
  enabled: true
  title: 高花费零转化广告异常
  threshold: 1
  anchor: baseline
  severity: warning
  description: 存在单条花费超R${threshold_value}的零转化广告
- id: low_ad_ctr
  enabled: true
  title: 广告点击率偏低
  threshold: 0.02
  anchor: baseline
  severity: info
  description: 平均广告点击率低于{threshold_pct}
