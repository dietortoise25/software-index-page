<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; padding: 12px; font-family: sans-serif; font-size: 13px; }
  button { width: 100%; padding: 8px; cursor: pointer; border: none; border-radius: 4px; font-size: 13px; }
  .primary { background: #2563eb; color: white; }
  .primary:hover { background: #1d4ed8; }
  .status { margin-top: 8px; padding: 6px; border-radius: 4px; font-size: 12px; }
  .ok { background: #dcfce7; color: #166534; }
  .err { background: #fef2f2; color: #991b1b; }
  .info { background: #f0f9ff; color: #075985; }
  pre { font-size: 10px; word-break: break-all; margin: 4px 0 0; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <button id="btn" class="primary">发送 Cookie 给代理</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
